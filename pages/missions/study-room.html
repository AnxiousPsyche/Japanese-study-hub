<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neko Bunko Study Room - Codecademy-style N5 learning">
    <title>Study Room - Neko Bunko</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=M+PLUS+U&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/study-style.css">
    <link rel="stylesheet" href="../../assets/css/companion-cat.css">
    <link rel="stylesheet" href="../../assets/css/kanji-cards.css">
    <link rel="stylesheet" href="../../assets/css/streak-popup.css">
    <!-- jsPDF + html2canvas: client-side PDF generation for the printer
         icon's per-lesson vocab export (assets/js/lesson-pdf.js). jsPDF's
         own built-in fonts can't render Japanese glyphs, so the export
         renders an off-screen HTML table (in the page's own DotGothic16
         Japanese web font, loaded above) via jsPDF's doc.html(), which
         rasterizes through html2canvas instead of relying on jsPDF's
         font system — same plain-CDN-script pattern as Bootstrap/Phaser
         elsewhere in this no-build project. -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="study-room is-terminal is-active">
        <header class="study-header">
            <span class="study-header__dots" aria-hidden="true"><span></span><span></span><span></span></span>
            <a href="levels-dashboard.html" class="study-header__back">&larr; Levels</a>
            <a href="../../index.html" class="study-header__back" aria-label="Back to Home" title="Back to Home">&#127968;</a>
            <h1 class="study-header__title">&#128218; Study Room</h1>
            <select class="study-header__lesson-picker" id="studyLessonSelect" aria-label="Choose a lesson"></select>
            <div class="study-header__toggle">
                <span class="study-header__toggle-seg study-header__toggle-seg--active">&#128214; Document</span>
                <a href="../N5/n5-dashboard.html" class="study-header__toggle-seg">&#127983; Adventure</a>
            </div>
            <button type="button" class="study-header__print-btn" id="studyPrintBtn" title="Print this lesson's vocabulary (PDF)" aria-label="Print this lesson's vocabulary">
                <img src="../../assets/images/lesson/printer-image-Original.png" alt="">
            </button>
            <span class="xp-badge">&#11088; <span data-study-xp>0</span> XP</span>
        </header>
        <div class="study-body">
            <div class="study-main">
                <div class="study-instruction" id="studyInstruct"></div>
                <div class="study-resize-handle" id="studyResizeHandle" role="separator" aria-orientation="vertical" aria-label="Resize lesson panels"></div>
                <div class="study-practice-col">
                    <div class="kanji-cards" id="kanjiCards" style="display:none"></div>
                    <div id="checkpointQuiz" style="display:none"></div>
                    <div id="mondaiQuiz" style="display:none"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="../../assets/js/study-progress.js"></script>
    <script src="../../assets/js/lesson-pdf.js"></script>
    <script src="../../assets/js/kanji-cards.js"></script>
    <script src="../../assets/js/study-panel-resize.js"></script>
    <script src="../../assets/js/study-room.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        if (window.StudyProgress) StudyProgress.renderXpBadges();
        if (window.StudyRoom) StudyRoom.init();
    });
    </script>
    <script src="../../assets/js/progress.js"></script>
    <script src="../../assets/js/streak-popup.js"></script>
    <script src="../../assets/js/companion-cat.js"></script>
</body>
</html>
