<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neko Bunko Study Room - Codecademy-style N5 learning">
    <title>Study Room - Neko Bunko</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@300;400;600;700;800&family=DotGothic16&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/study-style.css">
</head>
<body>
    <div class="study-room is-active">
        <header class="study-header">
            <a href="../../index.html" class="study-header__back">&larr; Home</a>
            <h1 class="study-header__title">&#128218; Study Room</h1>
            <a href="../N5/n5-dashboard.html" class="study-header__adventure-btn">&#127968; Adventure Room</a>
            <span class="study-header__level">JLPT N5</span>
        </header>
        <div class="study-body">
            <nav class="study-sidebar" id="studySidebar"></nav>
            <div class="study-main">
                <div class="study-instruction" id="studyInstruct"></div>
                <div class="study-practice" id="studyPractice">
                    <p class="study-practice__prompt"></p>
                    <div class="study-progress">
                        <div class="study-progress__bar"><div class="study-progress__fill" id="studyProgressFill"></div></div>
                        <span class="study-progress__text" id="studyProgressText">0 / 3</span>
                    </div>
                    <div class="study-practice__input-row">
                        <input type="text" class="study-practice__input" id="studyInput" placeholder="Type your answer in hiragana..." autocomplete="off" spellcheck="false">
                        <button class="study-practice__btn study-practice__btn--check" id="studyCheckBtn">Check</button>
                        <button class="study-practice__btn study-practice__btn--hint" id="studyHintBtn">Hint</button>
                        <button class="study-practice__btn study-practice__btn--next" id="studyNextBtn" style="display:none">Next &#8594;</button>
                        <button class="study-practice__btn study-practice__btn--skip" id="studySkipBtn">Skip</button>
                    </div>
                    <div class="study-practice__feedback" id="studyFeedback"></div>
                </div>
                <div class="study-complete" id="studyComplete"></div>
            </div>
        </div>
    </div>
    <script src="../../assets/js/study-room.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        if (window.StudyRoom) window.StudyRoom.init();
    });
    </script>
</body>
</html>
